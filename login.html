<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VOX — Sign In</title>
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh;">

  <div class="ambient-glow ambient-top-left"></div>
  <div class="ambient-glow ambient-bottom-right"></div>

  <div class="app-container" style="justify-content:center; padding:24px;">
    
    <div style="text-align:center; margin-bottom:28px;">
      <div class="vox-logo" style="font-size:36px; margin-bottom:8px;">VOX</div>
      <p style="font-size:14px; color:var(--text-secondary);">"Just say it. VOX does the rest."</p>
      <span class="demo-tag" style="display:inline-block; margin-top:8px;">Android-First Finance Voice AI</span>
    </div>

    <div class="glass-card" style="padding:22px;">
      <form id="loginPageForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="user@vox.ai" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPass" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="btn-group" style="margin-top:14px;">
          <button type="submit" class="btn btn-primary" id="btnPageLogin">Sign In</button>
          <button type="button" class="btn btn-secondary" id="btnPageRegister">Register</button>
        </div>
      </form>

      <div style="margin:20px 0; text-align:center; font-size:11px; color:var(--text-muted); position:relative;">
        <span style="background:#111A2E; padding:0 8px; position:relative; z-index:2;">OR LIVE DEMO ACCESS</span>
        <div style="position:absolute; top:50%; left:0; right:0; height:1px; background:rgba(255,255,255,0.1); z-index:1;"></div>
      </div>

      <button class="btn btn-secondary" id="btnPageInstantDemo" style="width:100%; border-color:var(--violet); color:#D8B4FE;">
        ⚡ Instant Demo Access (Preloaded INR Data)
      </button>

      <div style="text-align:center; margin-top:16px;">
        <a href="index.html" style="font-size:12px; color:var(--text-muted); text-decoration:none;">
          ← Back to Main App
        </a>
      </div>
    </div>

  </div>

  <script type="module">
    import { authService, dbService } from './js/firebaseService.js';

    document.getElementById('btnPageInstantDemo').onclick = async () => {
      await authService.loginDemoUser();
      window.location.href = 'index.html';
    };

    document.getElementById('loginPageForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      try {
        await authService.loginWithEmail(email, pass);
        window.location.href = 'index.html';
      } catch (err) {
        alert('Login failed: ' + err.message);
      }
    };

    document.getElementById('btnPageRegister').onclick = async () => {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      if (!email || !pass) {
        alert('Please provide email and password.');
        return;
      }
      try {
        await authService.registerWithEmail(email, pass);
        window.location.href = 'onboarding.html';
      } catch (err) {
        alert('Registration failed: ' + err.message);
      }
    };
  </script>
</body>
</html>
